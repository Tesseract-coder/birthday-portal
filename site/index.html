<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday, Gayatri</title>
  <meta name="description" content="A little collection of love for Gayatri's 31st birthday.">
  <meta name="theme-color" content="#fbf3ef">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <main id="story">
    <section class="welcome">
      <div class="welcome-inner">
        <p class="kicker fade-up" style="--d:.2s">a birthday letter, in many hands</p>
        <h1 class="fade-up" style="--d:.5s">
          <span class="script">Happy Birthday</span>
          <span class="serif">Gayatri</span>
        </h1>
        <p class="age fade-up" style="--d:.9s">thirty-one, and more loved than ever</p>
        <p class="lede fade-up" style="--d:1.2s">
          Some people who adore you have left you little notes.
          Take your time. Scroll slowly, and let each one find you.
        </p>
      </div>
      <div class="scroll-cue fade-up" style="--d:1.8s" aria-hidden="true">
        <span>scroll</span><i></i>
      </div>
    </section>

    <!-- messages are inserted here by app.js -->
    <div id="messages"></div>

    <section class="closing reveal">
      <div class="closing-inner">
        <p class="kicker">and finally</p>
        <h2 class="script">From Kunal</h2>
        <div id="closing-body" class="closing-body"></div>
        <p class="signoff">Happy birthday, my love. ♡</p>
      </div>
    </section>
  </main>

  <button class="music-btn intro" id="music" hidden aria-label="Background music" aria-pressed="true">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="label">tap for music</span>
  </button>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Close">×</button>
    <img alt="">
  </div>

  <script src="app.js" defer></script>
</body>
</html>
